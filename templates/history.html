<!DOCTYPE html>
<html>
<head><title>History</title></head>
<body>
  <h1>History</h1>
  <a href="/">Back</a>
  <table border="1" cellpadding="10">
    <tr><th>ID</th><th>Ticket</th><th>Draft Reply</th></tr>
    {% for t in tickets %}
    <tr><td>{{ t['id'] }}</td><td>{{ t['ticket_text'] }}</td><td>{{ t['draft_reply'] }}</td></tr>
    {% endfor %}
  </table>
</body>
</html>
