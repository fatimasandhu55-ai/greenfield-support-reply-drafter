<!DOCTYPE html>
<html>
<head><title>Ticket Draft</title></head>
<body>
  <h1>Support Ticket Draft</h1>
  <a href="/history">View History</a>
  <form method="POST">
    <textarea name="ticket_text" rows="6" cols="60" placeholder="Paste ticket text here...">{{ ticket_text }}</textarea><br>
    <button type="submit">Submit</button>
  </form>
  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}
  {% if draft %}
    <h3>Generated Draft:</h3>
    <div style="border:1px solid #ccc; padding:10px;">{{ draft }}</div>
  {% endif %}
</body>
</html>
