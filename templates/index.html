<!doctype html><html><head><title>Ticket Reply</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="container mt-4">
<h2>Ticket Reply Generator</h2>
<a href="/history" class="btn btn-secondary mb-3">History</a>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="POST"><textarea name="ticket" class="form-control" rows="5">{{ ticket }}</textarea><br>
<button class="btn btn-primary">Submit</button></form>
{% if draft %}<div class="card mt-4"><div class="card-body"><h5>Draft Reply:</h5><p>{{ draft }}</p></div></div>{% endif %}
</body></html>
